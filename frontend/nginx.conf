# ---------------------------------------------------------------------------
# OpsNow frontend — nginx server block (Phase 14)
#
# This file is not just "serve a SPA". It is the piece that makes the API
# same-origin, which is the ONLY configuration in which OpsNow's
# authentication works at all. Three things below are load-bearing and each
# one silently breaks the session if it is changed:
#
#   1. `proxy_set_header Host $http_host` — NOT $host, and not the default.
#      The backend's assertTrustedOrigin() compares the browser's `Origin`
#      header against its own `Host` header. The browser sends
#      `Origin: http://localhost:8080`, so the backend must see
#      `Host: localhost:8080`. nginx's default rewrites Host to the upstream
#      name, and `$host` drops the port — either one turns every refresh and
#      logout into a 403.
#
#   2. `proxy_pass http://backend:3000;` with no URI part, and no `rewrite`.
#      The refresh cookie is scoped to `path=/api/v1/auth`, and the browser
#      matches that against the URL IT sees. Any rewrite of the prefix means
#      the cookie stops being sent back and the session dies with no error.
#
#   3. The backend is not published to the host at all (see
#      docker-compose.yml). It is reachable only through this proxy, so there
#      is no second, cross-origin way in. The backend enables no CORS, so such
#      a route would not work anyway — but not having one is the point.
#
# This mirrors `vite.config.ts`'s dev proxy, which carries the same warnings.
#
# A fourth thing is load-bearing for security rather than auth: nginx does
# NOT merge `add_header` down the block hierarchy. If a `location` declares
# even one `add_header` of its own, the ENTIRE set inherited from `server` is
# discarded for that location — not just the header being overridden. Both
# `/assets/` and `/` below set their own Cache-Control, so each one repeats
# the four security headers in full; dropping that repetition would silently
# ship index.html and the JS bundle with no CSP, no X-Frame-Options, etc.
# `/api/` sets no `add_header` of its own, so it inherits the `server` block
# copy untouched and needs no repetition.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in responses.
    server_tokens off;

    # Uploads are not a feature; a small cap keeps a pointless request cheap.
    client_max_body_size 1m;

    # --- security headers ---------------------------------------------------
    # `always` so they are present on error responses too, not only on 2xx.
    # Applies as-is to `/api/`; `/assets/` and `/` repeat these verbatim
    # alongside their own Cache-Control (see the note above).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Cross-origin isolation of the browsing context; frame-ancestors is the
    # modern form of X-Frame-Options and both are sent deliberately.
    #
    # 'unsafe-inline' is allowed for STYLE only. Vite emits the application's
    # CSS as a file, but Tailwind and React can still attach inline styles at
    # runtime. No such allowance is made for script-src: the bundle is a
    # single external file, so any inline script would be an injection.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # See note 1 above. This line is the session.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appended, not replaced, so the chain stays honest. The backend reads
        # it according to TRUST_PROXY_HOPS, which must be set to the number of
        # proxies in front of it — 1 for this compose stack (ADR-026).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An AI assistant call can legitimately take as long as the provider
        # timeout (AI_TIMEOUT_MS, default 15s), so the read timeout must sit
        # above it or nginx cuts the request off first and the user sees a
        # gateway error instead of the assistant's own failure message.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- static assets ------------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached hard and
    # forever; a deploy changes the name rather than the contents.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeated: this location's own add_header above cancels inheritance
        # from `server` (see the file header note).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- the application ----------------------------------------------------
    location / {
        # index.html must never be cached: it is what points at the current
        # fingerprinted bundle, so a stale copy pins a browser to a deleted
        # asset and the app fails to load after a deploy.
        add_header Cache-Control "no-store" always;
        # Repeated: this location's own add_header above cancels inheritance
        # from `server` (see the file header note).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # History fallback for client-side routes such as /tickets/:id.
        try_files $uri $uri/ /index.html;
    }
}
